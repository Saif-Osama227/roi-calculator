<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Car Loan ROI Calculator</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 40px 20px;
      max-width: 800px;
      margin: auto;
      background: #f9f9f9;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #005baa;
    }
    .note {
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 20px;
      text-align: center;
      line-height: 1.4;
    }
    label {
      margin-top: 15px;
      font-weight: 600;
      display: block;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 1rem;
    }
    table {
      margin-top: 30px;
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #005baa;
      color: white;
    }
  </style>
</head>
<body>

<h1>Car Loan ROI Calculator</h1>
<p class="note">
  Minimum Salaries: ENBD & EIB: 4k banking / 6k non |  
  DIB: 3k |  
  ADCB: 5k |  
  ADIB: 5k |  
  SIB: 5k banking / 6k non
</p>

<label for="carPrice">Car Price (AED)</label>
<input type="number" id="carPrice" placeholder="e.g. 100000" oninput="syncDownPayment()"/>

<label for="downPaymentPercent">Down Payment Percentage (%)</label>
<input type="number" id="downPaymentPercent" placeholder="e.g. 20" oninput="updateDownPaymentFromPercent()"/>

<label for="downPaymentAmount">Down Payment Amount (AED)</label>
<input type="number" id="downPaymentAmount" placeholder="e.g. 20000" oninput="updatePercentFromDownPayment()"/>

<label for="salary">Monthly Salary (AED)</label>
<input type="number" id="salary" placeholder="e.g. 12000" />

<label for="nationality">Nationality</label>
<select id="nationality" onchange="handleBankOptions()">
  <option value="expat">Expat</option>
  <option value="local">UAE National</option>
</select>

<label for="ownership">Car Ownership</label>
<select id="ownership" onchange="updateBankOptions()">
  <option value="managed">Managed (Owned by individual)</option>
</select>

<label for="bank">Financing Bank</label>
<select id="bank" onchange="handleBankOptions()">
  </select>

<div id="goldenVisaContainer" style="display:none;">
  <label for="goldenVisa">Golden Visa Holder?</label>
  <select id="goldenVisa">
    <option value="no">No</option>
    <option value="yes">Yes</option>
  </select>
</div>

<div id="bankingCustomerContainer" style="display:none;">
  <label id="bankingLabel" for="bankingCustomer">Banking with DIB?</label>
  <select id="bankingCustomer">
    <option value="no">No</option>
    <option value="yes">Yes</option>
  </select>
</div>

<table id="resultsTable">
  <thead>
    <tr>
      <th>Tenure</th>
      <th>ROI</th>
      <th>Monthly Installment</th>
      <th>Total Interest</th>
    </tr>
  </thead>
  <tbody id="resultsBody">
    <tr><td>1 year</td><td>--</td><td>--</td><td>--</td></tr>
    <tr><td>2 years</td><td>--</td><td>--</td><td>--</td></tr>
    <tr><td>3 years</td><td>--</td><td>--</td><td>--</td></tr>
    <tr><td>4 years</td><td>--</td><td>--</td><td>--</td></tr>
    <tr><td>5 years</td><td>--</td><td>--</td><td>--</td></tr>
  </tbody>
</table>

<script>
// --- Input Sync Logic ---
function syncDownPayment() {
  updateDownPaymentFromPercent();
}

function updateDownPaymentFromPercent() {
  const price = parseFloat(document.getElementById("carPrice").value);
  const percent = parseFloat(document.getElementById("downPaymentPercent").value);
  if (price && percent >= 0) {
    document.getElementById("downPaymentAmount").value = ((percent / 100) * price).toFixed(2);
  }
  calculateEMIs();
}

function updatePercentFromDownPayment() {
  const price = parseFloat(document.getElementById("carPrice").value);
  const amount = parseFloat(document.getElementById("downPaymentAmount").value);
  if (price && amount >= 0) {
    document.getElementById("downPaymentPercent").value = ((amount / price) * 100).toFixed(2);
  }
  calculateEMIs();
}

// --- Bank Dropdown Logic ---
function updateBankOptions() {
  const bankSelect = document.getElementById('bank');
  
  // Added FAB and ADIB
  const allBanks = [
    { name: "Emirates NBD", value: "ENBD" },
    { name: "Dubai Islamic Bank", value: "DIB" },
    { name: "First Abu Dhabi Bank", value: "FAB" },
    { name: "Abu Dhabi Islamic Bank", value: "ADIB" },
    { name: "Sharjah Islamic Bank", value: "SIB" },
    { name: "Emirates Islamic Bank", value: "EIB" },
    { name: "Abu Dhabi Commercial Bank", value: "ADCB" }
  ];

  const allowedBanks = ["ENBD", "DIB", "FAB", "ADIB", "SIB", "EIB", "ADCB"];
  const currentVal = bankSelect.value;
  
  bankSelect.innerHTML = "";
  allBanks.forEach(bank => {
    if (allowedBanks.includes(bank.value)) {
      const option = document.createElement("option");
      option.value = bank.value;
      option.textContent = bank.name;
      bankSelect.appendChild(option);
    }
  });

  if(allowedBanks.includes(currentVal)) {
    bankSelect.value = currentVal;
  }

  handleBankOptions();
  calculateEMIs();
}

function handleBankOptions() {
  const selectedBank = document.getElementById("bank").value;
  const nationality = document.getElementById("nationality").value;
  
  // Golden Visa: Only for DIB Expat
  document.getElementById("goldenVisaContainer").style.display = (selectedBank === "DIB" && nationality === "expat") ? "block" : "none";
  
  // Banking Customer: DIB, FAB, and ADIB
  const bankingContainer = document.getElementById("bankingCustomerContainer");
  const bankingLabel = document.getElementById("bankingLabel");
  
  if (["DIB", "FAB", "ADIB"].includes(selectedBank)) {
    bankingContainer.style.display = "block";
    // Dynamic Label
    if (selectedBank === "FAB") bankingLabel.textContent = "Banking with FAB?";
    else if (selectedBank === "ADIB") bankingLabel.textContent = "Banking with ADIB?";
    else bankingLabel.textContent = "Banking with DIB?";
  } else {
    bankingContainer.style.display = "none";
  }
  
  calculateEMIs();
}

// --- Rate Logic ---
function getRate() {
  const bank = document.getElementById("bank").value;
  const salary = parseFloat(document.getElementById("salary").value) || 0;
  const nationality = document.getElementById("nationality").value;
  const ownership = document.getElementById("ownership").value;
  const price = parseFloat(document.getElementById("carPrice").value) || 0;
  
  // Optional Inputs
  const goldenVisaEl = document.getElementById("goldenVisa");
  const goldenVisa = (goldenVisaEl && goldenVisaEl.offsetParent !== null) ? goldenVisaEl.value : "no";

  const bankingEl = document.getElementById("bankingCustomer");
  const banking = (bankingEl && bankingEl.offsetParent !== null) ? bankingEl.value : "no";

  // --- 1. Emirates NBD ---
  if (bank === "ENBD") {
    if (nationality === "local") return 2.89;
    if (salary >= 50000) return 3.09;
    if (salary >= 30000) return 3.39;
    if (salary >= 15000) return 3.59;
    if (salary >= 10000) return 3.89;
    return 4.09;
  }

  // --- 2. Dubai Islamic Bank ---
  if (bank === "DIB") {
    const isLocalOrGolden = nationality === "local" || goldenVisa === "yes";
    // Using Managed Rates
    if (isLocalOrGolden) {
      if (salary >= 35000) return 2.50;
      if (salary >= 25000) return 2.65;
      if (salary >= 15000) return 2.75;
      if (salary >= 10000) return 3.40;
      if (salary >= 5000) return 3.65;
      return 5.40;
    } else {
      if (banking === "yes") {
        if (salary >= 35000) return 3.40;
        if (salary >= 25000) return 3.40;
        if (salary >= 15000) return 4.15;
        if (salary >= 10000) return 4.65;
        if (salary >= 5000) return 5.15;
        return 6.15;
      } else {
        if (salary >= 35000) return 3.40;
        if (salary >= 25000) return 3.65;
        if (salary >= 15000) return 4.30;
        if (salary >= 10000) return 4.65;
        if (salary >= 5000) return 5.15;
        return 6.15;
      }
    }
  }

  // --- 3. First Abu Dhabi Bank (FAB) ---
  if (bank === "FAB") {
    // Logic: Used Car Rates Only
    
    // Check Special High Value Condition (Applies to all)
    // "if the car value is 200k or above and the salary is 25k or above"
    const isElite = (price >= 200000 && salary >= 25000);

    if (nationality === "local") {
      if (banking === "yes") {
        if (isElite) return 2.15;
        if (salary >= 40000) return 2.15;
        if (salary >= 30000) return 2.29;
        return 2.39; // 20k-29.9k
      } else {
        // Non-Banking Local
        if (isElite) return 2.74;
        if (salary >= 40000) return 2.74;
        if (salary >= 30000) return 2.81;
        return 2.81; // 20k-29.9k
      }
    } else {
      // Expat
      if (banking === "yes") {
        if (isElite) return 2.59;
        if (salary >= 40000) return 2.59;
        if (salary >= 30000) return 2.59;
        return 2.99; // 20k-29.9k
      } else {
        // Non-Banking Expat
        if (isElite) return 2.95;
        if (salary >= 40000) return 2.95;
        if (salary >= 30000) return 3.03;
        return 3.03; // 20k-29.9k
      }
    }
  }

  // --- 4. Abu Dhabi Islamic Bank (ADIB) ---
  if (bank === "ADIB") {
    // Logic: Listed Company + Without Credit Card + Used Car (Standard Conservative Option)
    // This corresponds to the 4th value in the slash-separated lists for Banking,
    // and 4th value for Non-Banking.
    
    if (banking === "yes") {
       if (salary >= 40000) return 2.69;
       if (salary >= 20000) return 2.79;
       if (salary >= 10000) return 3.89;
       return 4.39; // 5k-9.99k
    } else {
       // Non-Banking
       if (salary >= 40000) return 3.19;
       if (salary >= 20000) return 3.29;
       if (salary >= 10000) return 4.39;
       return 4.89; // 5k-9.99k
    }
  }

  // --- 5. Sharjah Islamic Bank ---
  if (bank === "SIB") {
    if (nationality === "local") {
      if (salary >= 50000) return 2.99;
      if (salary >= 35000) return 3.09;
      if (salary >= 20000) return 3.19;
      if (salary >= 10000) return 3.29;
      return 3.39;
    } else {
      if (salary >= 50000) return 3.29;
      if (salary >= 35000) return 3.39;
      if (salary >= 20000) return 3.49;
      if (salary >= 10000) return 3.59;
      return 3.69;
    }
  }

  // --- 6. Emirates Islamic Bank ---
  if (bank === "EIB") {
    if (nationality === "local") {
      return (price >= 150000) ? 2.89 : 2.99;
    } else {
      return (salary >= 10000) ? 3.19 : 3.49;
    }
  }

  // --- 7. ADCB ---
  if (bank === "ADCB") {
    if (nationality === "local") {
      if (salary >= 40000) return 2.99;
      if (salary >= 20000) return 2.99;
      if (salary >= 12000) return 3.10;
      if (salary >= 8000) return 3.84;
      return 4.35;
    } else {
      if (salary >= 40000) return 3.20;
      if (salary >= 20000) return 3.25;
      if (salary >= 12000) return 3.85;
      if (salary >= 8000) return 3.85;
      return 4.35;
    }
  }

  return 3.99; // Final fallback
}

// --- Calculation Logic ---
function calculateEMIs() {
  const priceVal = document.getElementById("carPrice").value;
  const salaryVal = document.getElementById("salary").value;
  const downVal = document.getElementById("downPaymentAmount").value;
  
  const body = document.getElementById("resultsBody");
  
  if (!priceVal || !salaryVal || !downVal) {
    body.innerHTML = `
      <tr><td>1 year</td><td>--</td><td>--</td><td>--</td></tr>
      <tr><td>2 years</td><td>--</td><td>--</td><td>--</td></tr>
      <tr><td>3 years</td><td>--</td><td>--</td><td>--</td></tr>
      <tr><td>4 years</td><td>--</td><td>--</td><td>--</td></tr>
      <tr><td>5 years</td><td>--</td><td>--</td><td>--</td></tr>
    `;
    return;
  }

  const price = parseFloat(priceVal);
  const down = parseFloat(downVal);
  const rate = getRate();

  body.innerHTML = "";

  for (let years = 1; years <= 5; years++) {
    const financeAmount = price - down;
    const totalInterest = financeAmount * (rate / 100) * years;
    const totalPayable = financeAmount + totalInterest;
    const emi = totalPayable / (years * 12);
    
    body.innerHTML += `
      <tr>
        <td>${years} year${years > 1 ? 's' : ''}</td>
        <td>${rate.toFixed(2)}%</td>
        <td>AED ${emi.toFixed(2)}</td>
        <td>AED ${totalInterest.toFixed(2)}</td>
      </tr>
    `;
  }
}

document.querySelectorAll('input, select').forEach(el => {
  el.addEventListener('input', calculateEMIs);
  el.addEventListener('change', calculateEMIs);
});

document.addEventListener('DOMContentLoaded', () => {
  updateBankOptions();
  calculateEMIs();
});
</script>

</body>
</html>
